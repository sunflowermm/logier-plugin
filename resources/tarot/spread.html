{{extend defaultLayout}}

{{block 'css'}}
<link rel="stylesheet" type="text/css" href="{{_res_path}}tarot/base.css"/>
<link rel="stylesheet" type="text/css" href="{{_res_path}}tarot/spread.css"/>
{{/block}}

{{block 'main'}}
<div class="tarot-spread">
  <header class="spread-head">
    {{if title}}<p class="spread-tag">{{title}}</p>{{/if}}
    <h1 class="spread-name">{{formationName}}</h1>
    <p class="spread-count">共 {{slotCount}} 张</p>
  </header>
  <div class="spread-grid {{gridClass}} {{if compact}}is-compact{{/if}}" style="--slot-card-w: {{cardWidth}}px;">
    {{each slots slot}}
    <article class="spread-slot">
      <div class="slot-role">{{slot.role}}</div>
      <div class="tarot-card-frame {{if slot.reversed}}is-reversed{{/if}}">
        <img class="tarot-card-img" src="{{slot.imageUrl}}" alt="{{slot.card.name_cn}}"/>
      </div>
      <div class="slot-name">{{slot.card.name_cn}}</div>
      <div class="slot-meta">{{slot.label}} · {{slot.typeLabel}}</div>
      <div class="slot-meaning">{{slot.meaning}}</div>
    </article>
    {{/each}}
  </div>
  <p class="tarot-watermark">Powered by XRK</p>
</div>
{{/block}}
